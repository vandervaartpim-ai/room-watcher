name: ROOM watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # elke 5 minuten (GitHub voert dit vaak later uit)
  workflow_dispatch:         # handmatig starten via de Actions-tab

permissions:
  contents: write            # nodig om seen.json op te slaan

concurrency:
  group: room-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check ROOM
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python room_watcher.py
      - name: Save seen.json
        run: |
          git config user.name "room-watcher"
          git config user.email "room-watcher@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen listings" && git push)
